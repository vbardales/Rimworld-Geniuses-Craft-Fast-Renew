<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Geniuses Craft Fast Renew — Preview</title>
<style>
  /* Colours are loaded from preview-palette.json by the renderer. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 896px; height: 504px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  .frame {
    position: relative; width: 896px; height: 504px;
    background: url("Preview-source.png") center / cover no-repeat;
  }
  .frame::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 680px at top left,
      rgba(var(--veil-rgb), .94) 0%, rgba(var(--veil-rgb), .90) 50%,
      rgba(var(--veil-rgb), 0) 100%);
  }
  .text {
    position: absolute; z-index: 1; left: 50px; top: 54px;
    color: var(--inkPrimary); text-shadow: 0 3px 10px rgba(0, 0, 0, .75);
  }
  h1, p { margin: 0; }
  h1 {
    width: 470px; font-size: 46px; font-weight: 600;
    line-height: 1.1; letter-spacing: 0;
  }
  .suffix { font-size: .65em; color: var(--inkSecondary); }
  .tag {
    margin-top: 8px; font-size: 24px; font-weight: 400;
    line-height: 1.1; letter-spacing: .2px; color: var(--inkSecondary);
  }
  .rule { width: 58px; height: 3px; margin: 20px 0 16px; background: var(--accent); }
  .summary {
    width: 430px; font-size: 21px; font-weight: 400;
    line-height: 1.45; letter-spacing: 0; color: var(--inkPrimary);
  }
  .badge {
    position: absolute; z-index: 2; top: 0; right: 0; width: 80px; height: 80px;
    background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
  .version {
    position: absolute; left: 53px; top: 27px;
    transform: translate(-50%, -50%) rotate(45deg);
    font-size: 26px; font-weight: 700; line-height: 1;
    color: var(--badgeInk); text-shadow: none;
  }
</style>
<div class="frame">
  <div class="text">
    <h1><span class="name">Geniuses Craft Fast</span> <span class="suffix">Renew</span></h1>
    <p class="tag">(unofficial)</p>
    <div class="rule"></div>
    <p class="summary">Crafting skill drives general labor speed. Ten times vanilla at level 20.</p>
  </div>
  <div class="badge"><span class="version"></span></div>
</div>
</html>
